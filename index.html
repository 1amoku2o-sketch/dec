<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Relevés des notes du BAC</title>
    <link rel="icon" type="image/png" href="logo.png" />
    <link rel="shortcut icon" href="logo.png" type="image/x-icon" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      .navbar { padding: 0.2rem 1rem; }
      .bg-green { background-color: #00a95c; }
      .navbar ul.navbar-nav .nav-item { margin-left: 0.5em; }
      .navbar a.nav-link { font-weight: 400; color: #fff; }
      .navbar a.nav-link:hover { color: rgba(255,255,255,0.85); }
      .navbar a.nav-link > span { display: flex; align-items: center; gap: 0.3125rem; }
      .navbar-brand.logo { padding: 0 7px; }
      .logo-img { height: 45px; width: 45px; display: inline-block; vertical-align: middle; margin-inline-end: 12px; object-fit: contain; }
      .navbar-title { display: inline-block; vertical-align: middle; color: #fff; font-weight: 700; }
      .jh-card { padding: 1.5%; margin-top: 20px; border: none; }
      .row-md.jh-entity-details { display: grid; grid-template-columns: auto 1fr; column-gap: 10px; line-height: 1.5; }
      .jh-entity-details > dt { margin-bottom: 0; padding: 0.5em 0; text-align: right; }
      .jh-entity-details > dd { margin-left: 0; margin-bottom: 0; padding: 0.5em 0; border-bottom: 1px solid #eee; }
      h2 { font-weight: 300; }
      .alert-notfound { text-align: center; padding: 3rem; }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-dark navbar-expand-md bg-green">
      <div class="container-fluid">
        <a class="navbar-brand logo" href="https://releve.education.gov.mr/">
          <img src="logo.png" alt="Armoiries de la Mauritanie" class="logo-img" />
          <span class="navbar-title" id="nav-title">Relevés des notes du BAC</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive">
          <span style="color:#fff;font-size:1.5rem;">&#9776;</span>
        </button>
        <div id="navbarResponsive" class="navbar-collapse collapse">
          <ul class="navbar-nav ms-auto" id="nav-list">
            <li class="nav-item">
              <a class="nav-link" href="https://releve.education.gov.mr/">
                <span id="nav-home">Accueil</span>
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#" id="lang-switch" onclick="toggleLanguage(event)">
                <span>العربية</span>
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container-fluid">
      <div class="card jh-card">
        <div class="d-flex justify-content-center">
          <div class="col-8">
            <div id="content-area"></div>
          </div>
        </div>
      </div>
      <div class="footer mt-5"><p>dec.education.gov.mr</p></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const candidates = {
        "00309": {
          nni: "3898414384",
          dossier: "00309",
          serie: "Mathématiques",
          decision: "Admis",
          centreAr: "ثانوية التميز 3",
          centreFr: "Lycée Excellence 3",
          nomAr: "عبدالله محمد عبدالرحمن الدين",
          nomFr: "Abdallahi Mohamed Abderahmane Dine",
          lieuAr: "تيارت",
          lieuFr: "Teyaret",
          dateNais: "21/12/2006",
          moy: "14.51",
          anonyme: "3898414384",
          etcc: "MT09"
        },
        "52477": {
          nni: "3355519740",
          dossier: "52477",
          serie: "SN",
          decision: "Admis",
          centreAr: "مدرسة الشيخ محمد المامي تيارت",
          centreFr: "ECOLE CHEIKH MD EL MAMY TEY",
          nomAr: "سعد الشيخ ابراهيم الدين",
          nomFr: "Saaed Cheikh Brahim Dine",
          lieuAr: "دار النعيم",
          lieuFr: "Dar Naim",
          dateNais: "6 sept. 2007",
          moy: "14.7703125",
          anonyme: "66741",
          etcc: "SN13"
        }
      };

      let currentLang = 'fr';

      const translations = {
        fr: {
          navTitle: "Relevés des notes du BAC",
          home: "Accueil",
          langSwitch: "العربية",
          title: "Candidat",
          nni: "Numéro National d'Identification (NNI)",
          dossier: "N° Dossier",
          serie: "Serie",
          decision: "Décision",
          centreAr: "Centre en Arabe",
          centreFr: "Centre en Français",
          nomAr: "Nom en Arabe",
          nomFr: "Nom",
          moy: "Moy Générale",
          anonyme: "No ANONYME",
          etcc: "No ETCC",
          lieuAr: "Lieu Naissance en Arabe",
          lieuFr: "Lieu Naissance",
          dateNais: "Dat Naissance",
          btnText: "Retour",
          notFound: "Aucun candidat trouvé pour ce numéro."
        },
        ar: {
          navTitle: "كشوف درجات البكالوريا",
          home: "الصفحة الرئيسية",
          langSwitch: "Français",
          title: "المترشح",
          nni: "الرقم الوطني للتعريف",
          dossier: "رقم الترشح",
          serie: "الشعبة",
          decision: "القرار",
          centreAr: "Centre en Arabe",
          centreFr: "Centre en Français",
          nomAr: "Nom en Arabe",
          nomFr: "الإسم",
          moy: "المعدل العام",
          anonyme: "No ANONYME",
          etcc: "No ETCC",
          lieuAr: "Lieu Naissance en Arabe",
          lieuFr: "Lieu Naissance",
          dateNais: "Dat Naissance",
          btnText: "رجوع",
          notFound: "لم يتم العثور على مترشح بهذا الرقم."
        }
      };

      function render(c) {
        const t = translations[currentLang];
        document.getElementById('content-area').innerHTML = `
          <h2 id="main-title">${t.title}</h2><hr/>
          <dl class="row-md jh-entity-details">
            <dt><span id="label-nni">${t.nni}</span></dt><dd><span>${c.nni}</span></dd>
            <dt><span id="label-dossier">${t.dossier}</span></dt><dd><span id="val-dossier">${c.dossier}</span></dd>
            <dt><span id="label-serie">${t.serie}</span></dt><dd><span>${c.serie}</span></dd>
            <dt><span id="label-decision">${t.decision}</span></dt><dd><span>${c.decision}</span></dd>
            <dt><span id="label-centre-ar">${t.centreAr}</span></dt><dd><span>${c.centreAr}</span></dd>
            <dt><span id="label-centre-fr">${t.centreFr}</span></dt><dd><span>${c.centreFr}</span></dd>
            <dt><span id="label-nom-ar">${t.nomAr}</span></dt><dd><span>${c.nomAr}</span></dd>
            <dt><span id="label-nom-fr">${t.nomFr}</span></dt><dd><span>${c.nomFr}</span></dd>
            <dt><span id="label-moy">${t.moy}</span></dt><dd><span>${c.moy}</span></dd>
            <dt><span id="label-anonyme">${t.anonyme}</span></dt><dd><span>${c.anonyme}</span></dd>
            <dt><span id="label-etcc">${t.etcc}</span></dt><dd><span>${c.etcc}</span></dd>
            <dt><span id="label-lieu-ar">${t.lieuAr}</span></dt><dd><span>${c.lieuAr}</span></dd>
            <dt><span id="label-lieu-fr">${t.lieuFr}</span></dt><dd><span>${c.lieuFr}</span></dd>
            <dt><span id="label-date-nais">${t.dateNais}</span></dt><dd><span>${c.dateNais}</span></dd>
          </dl>
          <button type="button" class="btn btn-info" onclick="window.history.back()">
            &nbsp;<span id="btn-text">${t.btnText}</span>
          </button>`;
      }

      function renderNotFound() {
        const t = translations[currentLang];
        document.getElementById('content-area').innerHTML = `
          <div class="alert-notfound">
            <h2>${t.title}</h2><hr/>
            <p class="text-danger fs-5">${t.notFound}</p>
            <button type="button" class="btn btn-info" onclick="window.history.back()">
              <span id="btn-text">${t.btnText}</span>
            </button>
          </div>`;
      }

      function loadCandidate() {
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        if (id && candidates[id]) {
          render(candidates[id]);
        } else if (id) {
          renderNotFound();
        } else {
          document.getElementById('content-area').innerHTML = `
            <h2>Relevés des notes du BAC</h2><hr/>
            <p class="text-muted">Utilisez ?id=NUMERO pour afficher les résultats d'un candidat.</p>`;
        }
      }

      function toggleLanguage(event) {
        if (event) event.preventDefault();
        currentLang = currentLang === 'fr' ? 'ar' : 'fr';
        const t = translations[currentLang];
        document.documentElement.setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');
        document.documentElement.setAttribute('lang', currentLang);
        document.title = t.navTitle;
        document.getElementById('nav-title').textContent = t.navTitle;
        document.getElementById('nav-home').textContent = t.home;
        document.getElementById('lang-switch').textContent = t.langSwitch;
        loadCandidate();
      }

      loadCandidate();
    </script>
  </body>
</html>
